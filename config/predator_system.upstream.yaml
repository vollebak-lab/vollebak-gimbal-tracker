# Predator System Configuration

system:
  name: "Predator"
  version: "0.1.0"
  compute: "Jetson Orin NX"
  compute_memory_gb: 16  # TBD — confirm 8 or 16

# Zenoh telemetry fabric
zenoh:
  mode: "peer"
  connect: []  # Empty for standalone; populated for swarm
  topics:
    events_aggregated: "predator/events/aggregated"
    layer1_detection: "predator/layer1/detection"
    radar_pointcloud_front: "predator/radar/pointcloud/front"
    radar_pointcloud_rear: "predator/radar/pointcloud/rear"
    radar_classification: "predator/radar/classification"
    fusion_track: "predator/fusion/track"
    system_state: "predator/system/state"
    engagement_command: "predator/engagement/command"
    engagement_status: "predator/engagement/status"

# State machine
state_machine:
  states:
    - SILENT
    - ALERT
    - RADAR_ACTIVE
    - TRACKING
    - ENGAGEMENT
    - BDA
  transitions:
    SILENT_to_ALERT:
      trigger: "layer1_detection"
      condition: "any camera detects propeller flicker"
    ALERT_to_RADAR_ACTIVE:
      trigger: "confirmed_detection"
      condition: ">=2 consecutive detections OR >=2 cameras"
    RADAR_ACTIVE_to_TRACKING:
      trigger: "radar_acquisition"
      condition: "radar acquires target, EKF initialized"
    TRACKING_to_ENGAGEMENT:
      trigger: "threat_score"
      condition: "threat_score > threshold AND safety_zones_clear"
    ENGAGEMENT_to_BDA:
      trigger: "laser_fire"
      condition: "fire command sent to Thor laser module"
    BDA_to_SILENT:
      trigger: "kill_assessment"
      condition: "flicker_cessation OR engagement_timeout"

# Safety
safety:
  keep_out_cone_deg: 30.0   # Cone around operator head
  engagement_timeout_s: 10.0
  max_engagement_range_m: 300.0
  min_engagement_range_m: 10.0

# Engagement
engagement:
  laser:
    provider: "Thor Dynamics"
    type: "soft-kill"
    mode: "pulsed"                   # "pulsed" | "cw"
    optical_power_w: [2.0, 5.0]      # Average power range
    pulse_width_ns: 10               # Q-switched nanosecond pulse
    peak_power_class: "megawatt"     # Energy compression from Q-switching
    lidt_cmos_mj_cm2: 78.9          # Permanent CMOS damage threshold (pulsed)
    optical_gain_factor: 100000      # Drone lens funnel effect (intensity multiplier)
    claimed_range_km: 10.0
    interface: "GPIO/serial"  # TBD — confirm with Thor
    mount: "robotic arm + self-leveling gimbal"
  gimbal:
    servo_rate_hz: 200
    controller_language: "Rust"
    scan_patterns:
      - "Lissajous"
      - "Rosette"
      - "Raster"
      - "VerticalSweep"             # L1-only Waiter mode

# Waiter Mode — L1-only passive engagement (zero RF emission)
waiter_mode:
  enabled: true
  l1_engagement_confidence: 0.95     # Min confidence for L1-only engagement
  max_range_m: 50.0                  # Beyond this → fall back to radar pipeline
  auto_detect: true                  # Auto-engage from geometry (no operator toggle)
  sweep_rate_dps: 180.0              # Max gimbal rate for vertical sweep
  sweep_passes: 3                    # Multi-pass for probabilistic coverage
  sweep_margin_deg: 5.0              # Margin around estimated elevation

# Operator calibration (set during initial outfitting)
operator:
  eye_height_m: 1.75                 # Measured during equipment issue
  helmet_camera_offset_m: 0.10       # Camera mount above eye level
  ansur_min_height_m: 1.37           # 1.52m × 0.9 (10% buffer low)
  ansur_max_height_m: 1.79           # 1.63m × 1.1 (10% buffer high)
