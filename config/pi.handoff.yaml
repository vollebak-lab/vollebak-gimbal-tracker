camera:
  source: http://127.0.0.1:8082/stream.mjpg
  width: 640
  height: 480
  fps: 30
  backend: v4l2

event_camera:
  enabled: true
  base_url: http://127.0.0.1:8081
  poll_interval_s: 0.02
  timeout_s: 5.0
  track_targets: true
  pan_offset_deg: 0.0
  tilt_offset_deg: 0.0

detector:
  type: motion
  min_area: 350
  history: 120
  threshold: 28
  warmup_frames: 10
  hsv_low: [35, 80, 60]
  hsv_high: [85, 255, 255]

calibration:
  path: calibration.json

gimbal:
  driver: waveshare_serial
  serial_port: /dev/ttyUSB0
  baud: 115200
  pan_min: -30.0
  pan_max: 30.0
  tilt_min: -10.0
  tilt_max: 15.0
  home_pan: 0.0
  home_tilt: 0.0
  speed: 0
  acceleration: 0

tracking:
  start_enabled: false
  command_hz: 100.0
  smoothing_alpha: 1.0
  deadband_deg: 0.0
  max_step_deg: 60.0
  lost_hold_s: 0.35
  park_after_s: 0.75

web:
  host: 0.0.0.0
  port: 8080
  jpeg_quality: 82
  fallback_demo: true
