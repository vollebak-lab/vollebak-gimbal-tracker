# Active integration policy for the Raspberry Pi 5 observation console.
# Bart's upstream source tree is preserved in this repository, but the Pi runtime
# intentionally ends at visual tracking and two-axis gimbal pointing.

system:
  name: "Predator Observation Console"
  profile: "RASPBERRY_PI_5_OBSERVER"
  compute: "Raspberry Pi 5"
  upstream_repository: "vollebak-lab/predator"
  upstream_commit: "ea46468"

runtime_policy:
  operating_mode: "OBSERVATION_ONLY"
  engagement_enabled: false
  engagement_commands_available: false
  automatic_actuation_beyond_gimbal_pointing: false

layers:
  layer1:
    active_sensor: "Logitech USB RGB camera"
    detector: "OpenCV motion detector"
    event_camera_status: "NOT_CONNECTED"
  layer2:
    radar_status: "NOT_CONNECTED"
    simulation_enabled: false
  layer3:
    mode: "RGB_BEARING_ONLY"
    max_local_tracks: 1
  layer4:
    actuator: "Waveshare 2-axis serial-bus-servo gimbal"
    driver_default: "mock"
    allowed_capability: "POINTING_ONLY"

telemetry:
  local_only: true
  dashboard: "http://127.0.0.1:8080"
