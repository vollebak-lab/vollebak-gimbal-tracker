[workspace]
resolver = "2"
members = [
    "crates/predator-messages",
    "crates/predator-orchestrator",
    "src/layer4_engagement/gimbal_controller",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Vollebak Engineering"]

[workspace.dependencies]
# Shared across all crates
zenoh = { version = "1.0", features = ["unstable"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
nalgebra = "0.33"
rmp-serde = "1.3"
chrono = { version = "0.4", features = ["serde"] }

# Internal crates
predator-messages = { path = "crates/predator-messages" }

[profile.release]
opt-level = 3
lto = true
